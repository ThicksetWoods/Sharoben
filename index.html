<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F6F3">
<title>しゃろべん記録 v5</title>
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#14161A; --sub:#7A8089; --faint:#A8AEB6;
  --line:#E7E4DE; --line2:#F0EEE9; --black:#16181C;
  --good:#2E9E6B; --warn:#C98A00; --bad:#D8483C; --blue:#3B6FE0;
  --tab-h:calc(58px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:var(--tab-h)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer}

/* ---- layout ---- */
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 24px}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 16px}
.eyebrow{font-size:12.5px;color:var(--sub);letter-spacing:.02em}
h1{font-size:30px;font-weight:800;margin:2px 0 0;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:5px;background:#EFEDE8;border-radius:999px;
  padding:6px 12px;font-size:12.5px;color:var(--ink);font-weight:600}

.card{background:var(--card);border-radius:18px;padding:16px 17px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,22,26,.04)}
.card h2{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 12px;letter-spacing:.06em}
.dark{background:var(--black);color:#fff;border-radius:20px;padding:20px 18px;margin-bottom:12px}
.dark .lab{font-size:12px;color:#8E949C;margin-bottom:8px}
.dark .big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.dark .meta{font-size:12.5px;color:#9AA0A8;margin-top:8px}
.dark .btn{display:block;width:100%;margin-top:16px;background:#fff;color:var(--black);
  border-radius:13px;padding:14px 0;font-size:15px;font-weight:700;text-align:center}

/* norma ring */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.ring .t1{font-size:16px;font-weight:700}
.ring .t2{font-size:13px;color:var(--sub);margin-top:2px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center;
  box-shadow:0 1px 2px rgba(20,22,26,.04)}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tile .u{font-size:11px;font-weight:600;color:var(--sub);margin-left:1px}
.tile .k{font-size:10.5px;color:var(--faint);margin-top:3px}

/* rows */
.row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sm{font-size:11.5px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--sub);white-space:nowrap}
.pill.b{border-color:var(--black);color:var(--black);font-weight:600}

/* bars */
.bar{height:6px;border-radius:3px;background:#EDEBE6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.gauge{position:relative;height:13px;border-radius:7px;background:#EDEBE6;overflow:hidden}
.gauge>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.gauge>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.75}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.inp{width:100%;background:#FBFAF8;border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:15px;outline:none;appearance:none}
.inp:focus{border-color:var(--black);background:#fff}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%237A8089' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.primary{width:100%;background:var(--black);color:#fff;border-radius:13px;padding:15px 0;
  font-size:15.5px;font-weight:700;text-align:center}
.primary:disabled{background:#D5D2CC;color:#fff}
.ghost{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  font-size:13.5px;font-weight:600}
.seg{display:flex;background:#EDEBE6;border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.toggle{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;
  font-weight:600;color:var(--sub);background:#FBFAF8;text-align:center}
.toggle.on{background:var(--black);border-color:var(--black);color:#fff}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:7px;background:#fff;font-size:14.5px}
.choice.on{border-color:var(--black);border-width:1.5px;background:#FBFAF8;font-weight:700}
.choice .s{float:right;font-size:12px;color:var(--faint);font-weight:400}
.x{color:var(--faint);font-size:19px;padding:0 4px;line-height:1}
.add{border:1px dashed var(--line);border-radius:11px;padding:11px 0;width:100%;
  font-size:13.5px;font-weight:600;color:var(--sub)}
textarea.inp{resize:vertical;line-height:1.6;font-size:14px}
.hint{font-size:11.5px;color:var(--faint);line-height:1.65;margin-top:9px}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:22px 0}
.warnbox{background:#FDF3E7;border:1px solid #F0D9B4;border-radius:12px;padding:12px 14px;
  font-size:13px;margin-bottom:12px;line-height:1.6}
.okbox{background:#EDF6F1;border:1px solid #C6E4D5;border-radius:12px;padding:12px 14px;
  font-size:13px;margin-bottom:12px}

/* heatmap */
.hm{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hmM{flex:none}
.hmM .lb{font-size:9.5px;color:var(--faint);height:13px}
.hmG{display:grid;grid-template-columns:repeat(7,9px);grid-auto-rows:9px;gap:2px}
.hmG i{border-radius:2px;display:block}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(247,246,243,.94);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:10px;font-weight:600}
.tabbar button.on{color:var(--ink)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,22,26,.4);z-index:60;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:17px;font-weight:800;margin:0 0 14px}
</style>
</head>

function weekStart(iso){var d=dow(iso);var back=(d-2+7)%7;return addD(iso,-back)}
function syncWeek(){
  var ws=weekStart(todayISO());
  if(S.week.start!==ws){

/* ---------- domain ---------- */
var sName=function(code){var s=S.subjects.filter(function(x){return x.code===code})[0];return s?s.name:code};
var tColor=function(t){var x=S.types.filter(function(y){return y.name===t})[0];return x?x.color:"#8A8A8E"};
var quotaTypes=function(){return S.types.filter(function(t){return t.quota}).map(function(t){return t.name})};
/* ノルマ対象は教材ごと。未設定なら種別の既定に従う */
var isQuota=function(m){
  if(m.quota===true||m.quota===false)return m.quota;
  var t=S.types.filter(function(x){return x.name===m.type})[0];
  return t?!!t.quota:false;
};
var spare=function(){return Math.max(0,+S.config.spareDays||0)};
var effDL=function(iso){return addD(iso,-spare())};

/* 周の区間＝完了フラグで区切る（v4.03と同じ思想） */
function lapSegments(recs,code,type){
  var rows=recs.filter(function(r){return r.subjectCode===code&&r.type===type})
    .slice().sort(function(a,b){return a.date===b.date?((a.done?1:0)-(b.done?1:0)):(a.date<b.date?-1:1)});
  var segs=[],cur=null;
  rows.forEach(function(r){
    if(!cur)cur={problems:0,minutes:0,done:false,first:null,last:null,ids:[]};
    cur.problems+=r.problems||0; cur.minutes+=r.minutes||0; cur.ids.push(r.id);
    if(cur.first==null)cur.first=r.date; cur.last=r.date;
    if(r.done){cur.done=true;if(r.lapTotal!=null&&+r.lapTotal>0)cur.problems=+r.lapTotal;segs.push(cur);cur=null}
  });
  if(cur)segs.push(cur);
  segs.forEach(function(s,i){s.lap=i+1});
  return segs;
}
function openSeg(code,type){var s=lapSegments(S.records,code,type);var l=s[s.length-1];return l&&!l.done?l:null}
function lastDone(code,type){
  var s=lapSegments(S.records,code,type).filter(function(x){return x.done});
  return s.length?s[s.length-1].last:null;
}
function progress(mat,recs){
  var segs=lapSegments(recs,mat.subjectCode,mat.type);
  var doneSegs=segs.filter(function(s){return s.done});
  var maxC=doneSegs.length;
  var cur=maxC+1, target=mat.targetLaps||0;
  var lap1=(mat.lap1Problems===""||mat.lap1Problems==null)?null:+mat.lap1Problems;
  var predicted=doneSegs.length?doneSegs[doneSegs.length-1].problems:lap1;
  if(!predicted&&lap1)predicted=lap1;
  var ready=!!(predicted&&predicted>0);
  var remaining=0;
  if(ready&&target>maxC){
    var inProg=segs.length>maxC?segs[segs.length-1].problems:0;
    if(segs.length&&segs[segs.length-1].done)inProg=0;
    remaining+=Math.max(0,predicted-inProg);
    var future=target-cur; if(future>0)remaining+=predicted*future;
  }
  return {remaining:remaining,current:cur,maxCompleted:maxC,predicted:predicted,ready:ready,target:target};
}
function nextMS(){
  var t=todayISO();
  return S.milestones.slice().filter(function(m){return m.date>=t})
    .sort(function(a,b){return a.date<b.date?-1:1})[0]||null;
}
function totalRemaining(){
  var st=S.config.startDate, recs=st?S.records.filter(function(r){return r.date>=st}):S.records;
  var sum=0;
  S.materials.forEach(function(m){
    if(!isQuota(m))return;
    var p=progress(m,recs); if(p.ready)sum+=p.remaining;
  });
  return sum;
}
function dailyQuota(){
  var nm=nextMS(); if(!nm)return null;
  var d=Math.max(1,days(todayISO(),effDL(nm.date)));
  return Math.ceil(totalRemaining()/d);
}
/* 優先度＝最終周回日の古い順（ノルマ対象の教材のみ） */
function priority(){
  var out=[];
  S.materials.forEach(function(m){
    if(!isQuota(m))return;
    var ld=lastDone(m.subjectCode,m.type);
    out.push({code:m.subjectCode,name:sName(m.subjectCode),type:m.type,
      last:ld,ago:ld?days(ld,todayISO()):null});
  });
  out.sort(function(a,b){
    var i=S.subjects.map(function(s){return s.code}).indexOf(a.code);
    var j=S.subjects.map(function(s){return s.code}).indexOf(b.code);
    return i-j;});
  out.sort(function(a,b){
    if(a.last==null&&b.last==null)return 0;
    if(a.last==null)return -1; if(b.last==null)return 1;
    return a.last<b.last?-1:1;
  });
  return out;
}
/* 科目単位（教材をまたいだ最古） */
var ROTATE_NG=function(code){var n=sName(code);return code==="99"||n==="その他"};
function prioritySubjects(){
  var by={};
  priority().forEach(function(r){
    if(ROTATE_NG(r.code))return;
    if(!by[r.code])by[r.code]={code:r.code,name:r.name,last:r.last,ago:r.ago};
    else{
      var c=by[r.code];
      if(r.last==null||(c.last!=null&&r.last<c.last)){c.last=r.last;c.ago=r.ago}
    }
  });
  var arr=Object.keys(by).map(function(k){return by[k]});
  arr.sort(function(a,b){
    if(a.last==null&&b.last==null)return 0;
    if(a.last==null)return -1; if(b.last==null)return 1;
    return a.last<b.last?-1:1;});
  return arr;
}
function minutesOn(iso){var s=0;S.records.forEach(function(r){if(r.date===iso)s+=r.minutes||0});return s}
function problemsOn(iso){var s=0;S.records.forEach(function(r){if(r.date===iso)s+=r.problems||0});return s}
function streak(){
  var n=0,d=todayISO();
  if(minutesOn(d)===0&&problemsOn(d)===0)d=addD(d,-1);
  while(minutesOn(d)>0||problemsOn(d)>0){n++;d=addD(d,-1);if(n>2000)break}
  return n;
}
function totalMinutes(){var s=0,st=S.config.startDate;
  S.records.forEach(function(r){if(!st||r.date>=st)s+=r.minutes||0});return s}
/* 4期構成：起算日〜実効締切を4分割（MSがあればMSの実効締切を境界に使う） */
function phases(){
  var st=S.config.startDate,en=effDL(S.config.examDate);
  var ms=S.milestones.map(function(m){return effDL(m.date)}).sort();
  var cuts;
  if(ms.length>=3){
    var pick=[ms[Math.floor(ms.length*1/4)],ms[Math.floor(ms.length*2/4)],ms[Math.floor(ms.length*3/4)]];
    cuts=pick;
  }else{
    var tot=days(st,en);
    cuts=[addD(st,Math.round(tot*.35)),addD(st,Math.round(tot*.62)),addD(st,Math.round(tot*.85))];
  }
  var bounds=[st].concat(cuts,[en]);
  var names=["第1期 土台","第2期 加速","第3期 圧縮","第4期 総復習"];
  var cyc=[70,50,30,10];
  var out=[];
  for(var i=0;i<4;i++)out.push({name:names[i],from:bounds[i],to:bounds[i+1],cycle:cyc[i]});
  return out;
}
function currentPhase(){
  var t=todayISO(),ps=phases();
  for(var i=0;i<ps.length;i++) if(t<=ps[i].to) return ps[i];
  return ps[ps.length-1];
}

function hmColor(m,future){
  if(future)return "#E9E7E2";
  if(!m)return "#F0EEE9";
  if(m<90){var r=Math.min(1,m/90);
    var mix=function(a,b){return Math.round(a+(b-a)*r)};
    return "rgb("+mix(0xF6,0xE8)+","+mix(0xD9,0x6A)+","+mix(0xD5,0x5E)+")"}
  if(m<180)return "#E8C15E";
  return "#5CB98A";
}
function heatmap(){
  var st=S.config.startDate,en=S.config.examDate,t=todayISO();
  if(!st||!en||en<st)return '<div class="empty">起算日と受験日を設定してください。</div>';
  var by={};S.records.forEach(function(r){by[r.date]=(by[r.date]||0)+(r.minutes||0)});
  var months=[],ym=st.slice(0,7),endYM=en.slice(0,7);
  while(ym<=endYM){months.push(ym);
    var y=+ym.slice(0,4),m=+ym.slice(5,7);m++;if(m>12){m=1;y++}ym=y+"-"+pad(m)}
  var h='<div class="hm">';
  months.forEach(function(ym){
    var y=+ym.slice(0,4),mo=+ym.slice(5,7);
    var lead=(new Date(Date.UTC(y,mo-1,1)).getUTCDay()+6)%7;   /* 月曜始まり */
    var nd=new Date(Date.UTC(y,mo,0)).getUTCDate();
    h+='<div class="hmM"><div class="lb">'+(mo===1?y+"年1月":mo+"月")+'</div><div class="hmG">';
    for(var i=0;i<42;i++){
      var day=i-lead+1;
      if(day<1||day>nd){h+='<i></i>';continue}
      var iso=ym+"-"+pad(day);
      if(iso<st||iso>en){h+='<i></i>';continue}
      h+='<i title="'+iso+'" style="background:'+hmColor(by[iso]||0,iso>t)+
        (iso===t?';box-shadow:0 0 0 1.5px #16181C':'')+'"></i>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}

    '<label class="f"><span>受験日</span><input type="date" class="inp" data-cfg="examDate" value="'+esc(S.config.examDate)+'"></label>'+
    '<label class="f"><span>予備日</span><input class="inp num" inputmode="numeric" data-cfg="spareDays" value="'+esc(S.config.spareDays)+'"></label>'+
    '<label class="f" style="margin-bottom:0"><span>目標時間</span><input class="inp num" inputmode="numeric" data-cfg="targetHours" value="'+esc(S.config.targetHours)+'"></label>'+
    '</div><div class="hint">締切は「マイルストーン設定日 − 予備日」で計算します。</div></div>';

  /* 教材種別 */
  html+='<div class="card"><h2>教材種別</h2>';
  S.types.forEach(function(ty,i){
    html+='<div class="row"><span class="dot" style="background:'+ty.color+'"></span>'+
      '<input class="inp" style="flex:1;padding:8px 10px" value="'+esc(ty.name)+'" data-ty="'+i+'" data-f="name">'+
      '<button class="pill'+(ty.quota?" b":"")+'" data-tyq="'+i+'">'+(ty.quota?"ノルマ対象":"対象外")+'</button>'+
      '<button class="x" data-delty="'+i+'">×</button></div>';
  });
  html+='<button class="add" data-addty="1" style="margin-top:8px">＋ 教材種別を追加</button>'+
    '<div class="hint">「ノルマ対象」にした種別だけが残り問題数と優先度の計算に入ります。名前を変えると記録の表示名も変わります（記録側の値は書き換わりません）。</div></div>';

  /* 科目 */
  html+='<div class="card"><h2>科目</h2>';
  S.subjects.forEach(function(s,i){
    html+='<div class="row"><input class="inp num" style="width:56px;padding:8px 10px" value="'+esc(s.code)+'" data-sub="'+i+'" data-f="code">'+
      '<input class="inp" style="flex:1;padding:8px 10px" value="'+esc(s.name)+'" data-sub="'+i+'" data-f="name">'+
      '<button class="x" data-delsub="'+i+'">×</button></div>';
  });
  html+='<button class="add" data-addsub="1" style="margin-top:8px">＋ 科目を追加</button></div>';

  /* 教材 */
  html+='<div class="card"><h2>教材（'+S.materials.length+'件）</h2>';
  S.materials.forEach(function(m,i){
    var q=isQuota(m);
    html+='<div style="border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;background:#FBFAF8">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">'+
        '<span class="dot" style="background:'+tColor(m.type)+'"></span>'+
        '<select class="inp" style="flex:1;padding:8px 26px 8px 10px;font-size:13.5px" data-mat="'+i+'" data-f="subjectCode">'+
          S.subjects.map(function(s){return '<option value="'+esc(s.code)+'"'+(m.subjectCode===s.code?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+
        '</select>'+
        '<select class="inp" style="flex:1;padding:8px 26px 8px 10px;font-size:13.5px" data-mat="'+i+'" data-f="type">'+
          S.types.map(function(ty){return '<option value="'+esc(ty.name)+'"'+(m.type===ty.name?" selected":"")+'>'+esc(ty.name)+'</option>'}).join("")+
        '</select>'+
        '<button class="x" data-delmat="'+i+'">×</button>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        '<label style="flex:1"><span class="sm">目標周回</span>'+
        '<input class="inp num" style="padding:8px 10px;text-align:center" inputmode="numeric" value="'+esc(m.targetLaps)+'" data-mat="'+i+'" data-f="targetLaps"></label>'+
        '<label style="flex:1"><span class="sm">1周目問題数</span>'+
        '<input class="inp num" style="padding:8px 10px;text-align:center" inputmode="numeric" value="'+esc(m.lap1Problems)+'" data-mat="'+i+'" data-f="lap1Problems" placeholder="—"></label>'+
        '<button class="toggle'+(q?" on":"")+'" style="flex:1;padding:9px 6px;font-size:12px;margin-top:16px" data-matq="'+i+'">'+
          (q?"ノルマ対象":"対象外")+'</button>'+
      '</div></div>';
  });
  html+='<button class="add" data-addmat="1">＋ 教材を追加</button>'+
    '<div class="hint">科目と種別はここで付け替えられます。1周目問題数を入れないとノルマは出ません。'+
    'ノルマの可否は教材ごとに決められ、未設定の教材は種別の既定（'+
    S.types.map(function(t){return esc(t.name)+(t.quota?"○":"×")}).join("・")+'）に従います。</div></div>';

  /* MS */
  html+='<div class="card"><h2>マイルストーン</h2>';
  S.milestones.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(m){
    html+='<div class="row"><input class="inp" style="width:88px;padding:8px 10px" value="'+esc(m.name)+'" data-msx="'+m.id+'" data-f="name">'+
      '<input type="date" class="inp" style="flex:1;padding:8px 10px" value="'+esc(m.date)+'" data-msx="'+m.id+'" data-f="date">'+
      '<button class="x" data-delms="'+m.id+'">×</button></div>';
  });
  html+='<button class="add" data-addms="1" style="margin-top:8px">＋ マイルストーンを追加</button></div>';

  html+='<div class="card"><h2>データ</h2>'+
    '<button class="primary" data-export="1">バックアップを書き出す</button>'+
    '<div style="height:9px"></div>'+
    '<button class="ghost" style="width:100%" data-import="1">バックアップを読み込む</button>'+
    '<input type="file" id="fileIn" accept=".json" style="display:none">'+
    '<div class="hint">このブラウザに自動保存されます。書き出しは端末をまたぐときのバックアップ用です。</div></div>';
  html+='<div class="hint" style="text-align:center;margin-bottom:8px">しゃろべん記録 v5.00</div>';
  return html;
}

/* ---------- sheets ---------- */
var sheet=null;
function showSheet(kind){
  sheet=kind;
  var h='';
  if(kind==="pick"||kind==="pickcur"){
    var isCur=kind==="pickcur";
    var cand=prioritySubjects();
    h='<h3>'+(isCur?"今週":"来週")+'の科目</h3>'+
      '<div class="hint" style="margin:0 0 12px">最終周回日が古い順です。提案どおりでなくて構いません。</div>';
    cand.forEach(function(c,i){
      var sel=(isCur?S.week.current:S.week.next)===c.code;
      h+='<button class="choice'+(sel?" on":"")+'" data-pick="'+c.code+'" data-cur="'+(isCur?1:0)+'">'+
        '<span class="s">'+(c.last==null?"未着手":c.ago+"日前")+'</span>'+esc(c.name)+
        (i<3?' <span class="pill b" style="margin-left:6px">候補</span>':'')+'</button>';
    });
    h+='<button class="ghost" style="width:100%;margin-top:10px" data-close="1">閉じる</button>';
  }
  if(kind==="rec"){ go("rec"); sheet=null; return; }
  document.body.insertAdjacentHTML("beforeend",
    '<div class="sheetbg" id="sheetbg"><div class="sheet">'+h+'</div></div>');
}
function closeSheet(){sheet=null;var e=document.getElementById("sheetbg");if(e)e.remove()}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-go],[data-sheet],[data-close],[data-pick],[data-kind],[data-addblk],[data-delblk],"+
    "[data-toggledone],[data-submit],[data-openday],[data-del],[data-addty],[data-delty],[data-tyq],"+
    "[data-addsub],[data-delsub],[data-addmat],[data-delmat],[data-matq],[data-addms],[data-delms],[data-export],[data-import]");
  if(!el)return;
  var d=el.dataset;
  if(d.go){go(d.go);return}
  if(d.sheet){showSheet(d.sheet);return}
  if(d.close!==undefined){closeSheet();return}
  if(d.pick){ if(d.cur==="1")S.week.current=d.pick; else S.week.next=d.pick;
    save();closeSheet();render();return}
  if(d.kind){planKind=d.kind;render();return}
  if(d.addblk){S.dayTemplates[planKind].push({id:uid(),start:"",end:""});save();render();return}
  if(d.delblk){S.dayTemplates[planKind].splice(+d.delblk,1);save();render();return}
  if(d.toggledone){F.done=!F.done;render();return}
  if(d.submit){submit();return}
  if(d.openday){recOpen=recOpen===d.openday?null:d.openday;render();return}
  if(d.del){S.records=S.records.filter(function(r){return r.id!==d.del});save();render();return}
  if(d.addty){S.types.push({name:"新しい教材",color:"#8B5CF6",quota:true});save();render();return}
  if(d.delty){S.types.splice(+d.delty,1);save();render();return}
  if(d.tyq){var ty=S.types[+d.tyq];ty.quota=!ty.quota;save();render();return}
  if(d.addsub){S.subjects.push({code:String(S.subjects.length+1).padStart(2,"0"),name:"新科目"});save();render();return}
  if(d.delsub){S.subjects.splice(+d.delsub,1);save();render();return}
  if(d.matq){var mq=S.materials[+d.matq];mq.quota=!isQuota(mq);save();render();return}
  if(d.addmat){var s0=S.subjects[0],t0=S.types[0];if(!s0||!t0)return;
    S.materials.push({id:s0.code+"_"+t0.name,subjectCode:s0.code,type:t0.name,targetLaps:1,lap1Problems:""});
    save();render();return}
  if(d.delmat){S.materials.splice(+d.delmat,1);save();render();return}
  if(d.addms){S.milestones.push({id:uid(),name:"第"+(S.milestones.length+1)+"MS",date:todayISO(),plan:"",review:"",nextFocus:""});save();render();return}
  if(d.delms){S.milestones=S.milestones.filter(function(m){return m.id!==d.delms});save();render();return}
  if(d.export){doExport();return}
  if(d.import){document.getElementById("fileIn").click();return}
});
document.addEventListener("change",function(ev){
  var el=ev.target,d=el.dataset;
  if(el.id==="fileIn"&&el.files[0]){doImport(el.files[0]);return}
  if(d.wp!==undefined){S.weekPlan[d.wp]=el.value;save();render();return}
  if(d.f&&d.blk!==undefined){S.dayTemplates[planKind][+d.blk][d.f]=el.value.replace(/[^0-9]/g,"");save();render();return}
  if(d.mat!==undefined&&(d.f==="subjectCode"||d.f==="type")){
    var mv=S.materials[+d.mat]; mv[d.f]=el.value; mv.id=mv.subjectCode+"_"+mv.type;
    save();render();return}
  if(d.f&&["date","subjectCode","type","problems","hhmm","memo"].indexOf(d.f)>=0&&!d.mat&&!d.sub&&!d.ty&&!d.msx){
    F[d.f]=el.value; if(d.f==="subjectCode"||d.f==="type")render(); return}
});
document.addEventListener("input",function(ev){
  var el=ev.target,d=el.dataset;
  if(d.week){S.week[d.week]=el.value;save();return}
  if(d.ms){var m=S.milestones.filter(function(x){return x.id===d.ms})[0];if(m){m[d.f]=el.value;save()}return}
  if(d.msx){var m2=S.milestones.filter(function(x){return x.id===d.msx})[0];if(m2){m2[d.f]=el.value;save()}return}
  if(d.cfg){var v=el.value; if(d.cfg==="spareDays"||d.cfg==="targetHours")v=+v.replace(/[^0-9]/g,"")||0;
    S.config[d.cfg]=v;save();return}
  if(d.ty!==undefined&&d.f){S.types[+d.ty][d.f]=el.value;save();return}
  if(d.sub!==undefined&&d.f){S.subjects[+d.sub][d.f]=el.value;save();return}
  if(d.mat!==undefined&&d.f){var mm=S.materials[+d.mat];
    mm[d.f]=(d.f==="targetLaps")?(+el.value.replace(/[^0-9]/g,"")||0):el.value.replace(/[^0-9]/g,"");save();return}
  if(d.f&&["problems","hhmm","memo"].indexOf(d.f)>=0&&d.blk===undefined){F[d.f]=el.value;return}
});

function submit(){
  if(!F.date)F.date=todayISO();
  if(!F.subjectCode)F.subjectCode=(S.subjects[0]||{}).code||"";
  if(!F.type)F.type=(S.types[0]||{}).name||"";
  var p=+String(F.problems).replace(/[^0-9]/g,"")||0;
  var mi=parseHHMM(F.hhmm);
  if(!p&&!mi&&!F.done){alert("問題数か時間を入れてください。");return}
  var lap=lapSegments(S.records,F.subjectCode,F.type).length;
  var op=openSeg(F.subjectCode,F.type);
  S.records.unshift({id:uid(),date:F.date,subjectCode:F.subjectCode,type:F.type,
    lap:op?lap:lap+1,problems:p,wrong:0,minutes:mi,done:!!F.done,noPredict:false,memo:(F.memo||"").trim()});
  F.problems="";F.hhmm="";F.done=false;F.memo="";
  save();render();
}
function doExport(){
  var blob=new Blob([JSON.stringify(Object.assign({app:"sharoushi-study-manager",version:7},S),null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="ssm-backup-"+todayISO()+".json";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
function doImport(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{ S=migrate(JSON.parse(rd.result)); fill(); save(); render(); alert("読み込みました。"); }
    catch(e){ alert("読み込めませんでした。JSONを確認してください。"); }
  };
  rd.readAsText(file);
}

load();render();
</script>
