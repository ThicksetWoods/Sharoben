<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F6F3" id="themeColorMeta">
<title>しゃろべん記録 v6</title>
<style>
:root{
  --bg:#F7F6F3; --bgimg:none; --card:#FFFFFF; --ink:#14161A; --sub:#7A8089; --faint:#A8AEB6;
  --line:#E7E4DE; --line2:#F0EEE9; --panel:#16181C; --panelink:#FFFFFF; --panelsub:#9AA0A8;
  --track:#EDEBE6; --inpbg:#FBFAF8; --chip:#EFEDE8; --tabbg:rgba(247,246,243,.94);
  --hmEmpty:#F0EEE9; --hmFuture:#E9E7E2;
  --good:#2E9E6B; --warn:#C98A00; --bad:#D8483C;
  --tab-h:calc(58px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;padding:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:var(--tab-h);background:var(--bg);background-image:var(--bgimg);
  background-attachment:fixed;background-size:cover;min-height:100vh}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer}

.wrap{max-width:520px;margin:0 auto;padding:14px 16px 24px}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 16px}
.eyebrow{font-size:12.5px;color:var(--sub);letter-spacing:.02em}
h1{font-size:30px;font-weight:800;margin:2px 0 0;letter-spacing:-.02em}
.chip{display:inline-flex;flex-direction:column;align-items:flex-end;background:var(--chip);border-radius:14px;
  padding:6px 12px;font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.3}
.chip .cs{font-size:9.5px;color:var(--sub);font-weight:600;letter-spacing:.03em}

.card{background:var(--card);border-radius:18px;padding:16px 17px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,22,26,.05)}
.card h2{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 12px;letter-spacing:.06em}
.dark{background:var(--panel);color:var(--panelink);border-radius:20px;padding:20px 18px;margin-bottom:12px}
.dark .lab{font-size:12px;color:var(--panelsub);margin-bottom:8px}
.dark .big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.dark .meta{font-size:12.5px;color:var(--panelsub);margin-top:8px}
.dark .btn{display:block;width:100%;margin-top:16px;background:var(--card);color:var(--ink);
  border-radius:13px;padding:14px 0;font-size:15px;font-weight:700;text-align:center}

.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.ring .t1{font-size:16px;font-weight:700}
.ring .t2{font-size:13px;color:var(--sub);margin-top:2px}

.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center;
  box-shadow:0 1px 2px rgba(20,22,26,.05)}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tile .u{font-size:11px;font-weight:600;color:var(--sub);margin-left:1px}
.tile .k{font-size:10.5px;color:var(--faint);margin-top:3px}

.row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sm{font-size:11.5px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dotb{width:15px;height:15px;border-radius:50%;flex:none;border:1.5px solid var(--line);padding:0}
.pill{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--sub);white-space:nowrap}
.pill.b{border-color:var(--ink);color:var(--ink);font-weight:600}
.muted{opacity:.45}

.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.gauge{position:relative;height:13px;border-radius:7px;background:var(--track);overflow:hidden}
.gauge>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.gauge>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.75}

label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.inp{width:100%;background:var(--inpbg);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:15px;outline:none;appearance:none}
.inp:focus{border-color:var(--ink);background:var(--card)}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%237A8089' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;background:var(--panel);color:var(--panelink);border-radius:13px;padding:15px 0;
  font-size:15.5px;font-weight:700;text-align:center}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  font-size:13.5px;font-weight:600}
.seg{display:flex;background:var(--track);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg.sm button{padding:7px 0;font-size:11.5px}
.toggle{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;
  font-weight:600;color:var(--sub);background:var(--inpbg);text-align:center}
.toggle.on{background:var(--panel);border-color:var(--panel);color:var(--panelink)}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:7px;background:var(--card);font-size:14.5px}
.choice.on{border-color:var(--ink);border-width:1.5px;background:var(--inpbg);font-weight:700}
.choice .s{float:right;font-size:12px;color:var(--faint);font-weight:400}
.x{color:var(--faint);font-size:19px;padding:0 4px;line-height:1}
.add{border:1px dashed var(--line);border-radius:11px;padding:11px 0;width:100%;
  font-size:13.5px;font-weight:600;color:var(--sub)}
textarea.inp{resize:vertical;line-height:1.6;font-size:14px}
.hint{font-size:11.5px;color:var(--faint);line-height:1.65;margin-top:9px}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:22px 0}
.warnbox{background:#FDF3E7;border:1px solid #F0D9B4;border-radius:12px;padding:12px 14px;
  font-size:13px;margin-bottom:12px;line-height:1.6;color:#4A3B23}
.okbox{background:#EDF6F1;border:1px solid #C6E4D5;border-radius:12px;padding:12px 14px;
  font-size:13px;margin-bottom:12px;color:#22392F}

/* palette */
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;padding:10px 0 4px}
.pal button{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent}
.pal button.on{border-color:var(--ink)}

/* heatmap */
.hm{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hmM{flex:none}
.hmM .lb{font-size:9.5px;color:var(--faint);height:13px}
.hmG{display:grid;grid-template-columns:repeat(7,9px);grid-auto-rows:9px;gap:2px}
.hmG i{border-radius:2px;display:block}

/* charts */
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px}
.lgd span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--tabbg);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:10px;font-weight:600}
.tabbar button.on{color:var(--ink)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,22,26,.4);z-index:60;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:17px;font-weight:800;margin:0 0 14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabbar" id="tabbar"></div>
<script>
/* =====================================================================
   しゃろべん記録 v6.00
   - 科目/教材種別を id 参照に（改名しても統計が追随）
   - 非表示フラグ（種別・教材の2粒度）
   - 時間テンプレートの汎用化（曜日ごとに割り当て）
   - ノルマ母数＝対象期間のうちノルマ対象種別が割り当たった日
   - 時間統計（推移／配分・5粒度・科目/種別トグル）
   - テーマ5本＋階調（ページ背景のみ）
   依存ライブラリなし・完全オフライン・単一HTML
   ===================================================================== */
var KEY="ssm-v5-state";          /* 既存データを引き継ぐため v5 のキーのまま */
var VER=8;

/* ---------- utils ---------- */
var uid=function(){return Math.random().toString(36).slice(2,10)};
var pad=function(n){return String(n).padStart(2,"0")};
var todayISO=function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var days=function(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)};
var addD=function(iso,n){var d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var dow=function(iso){return new Date(iso+"T00:00:00").getDay()};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var parseHHMM=function(s){s=String(s||"").replace(/[^0-9]/g,"");if(s.length<3)return 0;
  s=s.padStart(4,"0");var h=+s.slice(0,2),m=+s.slice(2,4);if(m>59)return 0;return h*60+m};
var fmtHM=function(m){return Math.floor(m/60)+"時間"+pad(m%60)+"分"};
var fmtHMs=function(m){var h=Math.floor(m/60);return (h?h+"h":"")+(m%60)+"m"};
var md=function(iso){return (+iso.slice(5,7))+"/"+(+iso.slice(8,10))};
var WD=["日","月","火","水","木","金","土"];
var WEEK_ORDER=[2,3,4,5,6,0,1];   /* 火はじまり */

/* ---------- palettes ---------- */
var PALETTE=["#D8483C","#E0663B","#C98A00","#7E9B2E","#2E9E6B","#0E9AA7","#3B6FE0","#6B5CE0",
             "#8B5CF6","#B0466F","#8A6A4F","#5A6570","#C2557A","#3F8F8A","#A8792E","#6E8FB5"];

/* ---------- themes ---------- */
var THEMES={
  kinari:{name:"生成り",
    v:{bg:"#F7F6F3",card:"#FFFFFF",ink:"#14161A",sub:"#7A8089",faint:"#A8AEB6",
       line:"#E7E4DE",line2:"#F0EEE9",panel:"#16181C",panelink:"#FFFFFF",panelsub:"#9AA0A8",
       track:"#EDEBE6",inpbg:"#FBFAF8",chip:"#EFEDE8",tabbg:"rgba(247,246,243,.94)",
       hmEmpty:"#F0EEE9",hmFuture:"#E9E7E2"},
    grad:"linear-gradient(168deg,#FDFBF7 0%,#F7F2E9 38%,#F3E9DA 70%,#EFE2D0 100%)"},
  dark:{name:"やわらかダーク",
    v:{bg:"#22242A",card:"#2C2F36",ink:"#EDEAE4",sub:"#A2A8B2",faint:"#787E88",
       line:"#3A3E46",line2:"#33363D",panel:"#EDEAE4",panelink:"#1B1D22",panelsub:"#5E636C",
       track:"#3A3E46",inpbg:"#262930",chip:"#343841",tabbg:"rgba(34,36,42,.94)",
       hmEmpty:"#31343B",hmFuture:"#2A2D33",
       good:"#6FD3A2",warn:"#E8C15E",bad:"#FF8A7A"},
    grad:"linear-gradient(168deg,#2A2D35 0%,#24262C 45%,#1F2126 100%)"},
  akari:{name:"薄明かり",
    v:{bg:"#FBF6F6",card:"#FFFFFF",ink:"#2B2226",sub:"#7E6F76",faint:"#AC9CA3",
       line:"#EDDFE1",line2:"#F6ECEE",panel:"#3B2C33",panelink:"#FFF7F8",panelsub:"#A9959E",
       track:"#F0E3E5",inpbg:"#FDF9F9",chip:"#F3E6E8",tabbg:"rgba(251,246,246,.94)",
       hmEmpty:"#F4EAEB",hmFuture:"#EDE2E4"},
    grad:"linear-gradient(168deg,#FEF8F9 0%,#FAEFF1 35%,#F1F3E6 72%,#E9EFDD 100%)"},
  asagi:{name:"浅葱",
    v:{bg:"#F4F7F6",card:"#FFFFFF",ink:"#17262A",sub:"#6C8085",faint:"#9CAFB3",
       line:"#DDE7E5",line2:"#EDF3F1",panel:"#1E3A3C",panelink:"#F4FBF9",panelsub:"#8FA8A8",
       track:"#E4EDEA",inpbg:"#FAFCFB",chip:"#E6EFEC",tabbg:"rgba(244,247,246,.94)",
       hmEmpty:"#EAF1EF",hmFuture:"#E1EAE7"},
    grad:"linear-gradient(168deg,#FBFDF9 0%,#EFF6F3 40%,#E2EFEC 75%,#DAEAE6 100%)"},
  yugure:{name:"夕暮れ",
    v:{bg:"#FAF4F0",card:"#FFFFFF",ink:"#2E2320",sub:"#826B62",faint:"#B09B92",
       line:"#EDDED5",line2:"#F6ECE6",panel:"#3A2820",panelink:"#FFF6EF",panelsub:"#AC9184",
       track:"#F0E2DA",inpbg:"#FDFAF8",chip:"#F3E5DC",tabbg:"rgba(250,244,240,.94)",
       hmEmpty:"#F4E9E2",hmFuture:"#EEE0D8"},
    grad:"linear-gradient(168deg,#FFF6EC 0%,#FBE6D5 32%,#F2CFC6 62%,#DFC3D2 85%,#CDBBD6 100%)"}
};
function applyTheme(){
  var t=THEMES[S.config.theme]||THEMES.kinari, r=document.documentElement.style;
  var BASE={good:"#2E9E6B",warn:"#C98A00",bad:"#D8483C"};
  Object.keys(BASE).forEach(function(k){r.setProperty("--"+k,BASE[k])});
  Object.keys(t.v).forEach(function(k){r.setProperty("--"+k,t.v[k])});
  r.setProperty("--bgimg",S.config.gradient?t.grad:"none");
  var m=document.getElementById("themeColorMeta"); if(m)m.setAttribute("content",t.v.bg);
}

/* ---------- state ---------- */
var SEED={config:{startDate:todayISO(),examDate:"2027-08-22",spareDays:7,targetHours:1000,
    cyclePeriod:70,theme:"kinari",gradient:false},
  subjects:[],types:[],materials:[],records:[],milestones:[],results:[],
  timeTemplates:[],weekPlan:{},weekTemplate:{},week:{start:"",current:"",next:"",memo:""}};
var S=null;

function defaults(){return JSON.parse(JSON.stringify(SEED))}

/* ---- v5(名前参照) → v6(id参照) 移行 ---- */
var TYPE_RENAME={"秒トレ":"秒トレ選択"};          /* 旧「秒トレ」は選択版へ合流 */
var TYPE_HIDE_ON_MIGRATE={"トレ問":true};         /* 移行時に非表示＋対象外で作る */

function migrate(o){
  var d=defaults();
  d.config=Object.assign(d.config,o.config||{});
  if(d.config.cyclePeriod==null)d.config.cyclePeriod=70;
  if(!THEMES[d.config.theme])d.config.theme="kinari";
  d.config.gradient=!!d.config.gradient;
  d.results=o.results||[];
  d.milestones=(o.milestones||[]).map(function(m){
    return {id:m.id||uid(),name:m.name,date:m.date,plan:m.plan||"",review:m.review||"",nextFocus:m.nextFocus||""}});

  /* --- 科目 --- */
  var byCode={};
  d.subjects=(o.subjects||[]).map(function(s,i){
    var row={id:s.id||("s"+uid()),code:s.code,name:s.name,
             color:s.color||PALETTE[i%PALETTE.length],hidden:!!s.hidden};
    byCode[s.code]=row.id; return row;
  });
  var subjId=function(code){return byCode[code]||null};

  /* --- 教材種別：既存マスタ＋データ中の型名をすべて拾う --- */
  var byName={},list=[];
  var addType=function(name,color,quota,hidden){
    if(!name)return null;
    var canon=TYPE_RENAME[name]||name;
    if(byName[canon])return byName[canon];
    var row={id:"t"+uid(),name:canon,color:color||PALETTE[(list.length+4)%PALETTE.length],
             quota:quota!==false,hidden:!!hidden};
    list.push(row); byName[canon]=row.id; return row.id;
  };
  (o.types||[]).forEach(function(t){addType(t.name,t.color,t.quota,t.hidden)});
  (o.materials||[]).forEach(function(m){
    addType(m.type,null,m.type!=="テキスト",TYPE_HIDE_ON_MIGRATE[m.type])});
  (o.records||[]).forEach(function(r){
    addType(r.type,null,r.type!=="テキスト",TYPE_HIDE_ON_MIGRATE[r.type])});
  /* 移行時のみ：トレ問は対象外＋非表示に倒す（旧データを保持したまま画面から外す） */
  list.forEach(function(t){
    if(TYPE_HIDE_ON_MIGRATE[t.name]&&!(o.types||[]).some(function(x){return x.name===t.name})){
      t.hidden=true; t.quota=false;
    }
  });
  d.types=list;
  var typeId=function(name){var c=TYPE_RENAME[name]||name;return byName[c]||null};

  /* --- 教材：型名→typeId、科目コード→subjectId --- */
  var matKey={};
  d.materials=(o.materials||[]).map(function(m){
    var si=subjId(m.subjectCode||m.subject), ti=typeId(m.type);
    var row={id:m.id&&/^m/.test(m.id)?m.id:("m"+uid()),subjectId:si,typeId:ti,
      targetLaps:m.targetLaps||1,lap1Problems:m.lap1Problems==null?"":String(m.lap1Problems),
      hidden:!!m.hidden};
    if(m.quota===true||m.quota===false)row.quota=m.quota;
    matKey[si+"|"+ti]=1; return row;
  }).filter(function(m){return m.subjectId&&m.typeId});

  /* --- 記録 --- */
  d.records=(o.records||[]).map(function(r){
    return {id:r.id||uid(),date:r.date,subjectId:subjId(r.subjectCode||r.subject),
      typeId:typeId(r.type),lap:r.lap||1,problems:r.problems||0,wrong:r.wrong||0,
      minutes:r.minutes||0,done:!!r.done,memo:r.memo||"",lapTotal:r.lapTotal==null?null:r.lapTotal};
  }).filter(function(r){return r.subjectId&&r.typeId});

  /* --- 孤児の引き取り：記録があるのに教材が無い組合せを作る --- */
  d.records.forEach(function(r){
    var k=r.subjectId+"|"+r.typeId;
    if(matKey[k])return;
    matKey[k]=1;
    var ty=list.filter(function(t){return t.id===r.typeId})[0];
    d.materials.push({id:"m"+uid(),subjectId:r.subjectId,typeId:r.typeId,
      targetLaps:1,lap1Problems:"",hidden:!!(ty&&ty.hidden)});
  });

  /* --- 時間テンプレート：work/off → 汎用テンプレ --- */
  var dt=o.dayTemplates||{};
  if(o.timeTemplates&&o.timeTemplates.length){ d.timeTemplates=o.timeTemplates; }
  else{
    var w={id:"tt"+uid(),name:"仕事の日",blocks:(dt.work||dt.weekday||[]).map(function(b){
      return {id:b.id||uid(),start:b.start,end:b.end}})};
    var f={id:"tt"+uid(),name:"定休",blocks:(dt.off||dt.holiday||[]).map(function(b){
      return {id:b.id||uid(),start:b.start,end:b.end}})};
    d.timeTemplates=[w,f];
    d.weekTemplate={0:w.id,1:f.id,2:w.id,3:w.id,4:w.id,5:w.id,6:w.id};
  }
  if(o.weekTemplate)d.weekTemplate=o.weekTemplate;

  /* --- 曜日ごとの教材種別 --- */
  d.weekPlan={};
  Object.keys(o.weekPlan||{}).forEach(function(k){
    var ti=typeId(o.weekPlan[k]); if(ti)d.weekPlan[k]=ti;
  });
  d.week=o.week||{start:"",current:"",next:"",memo:""};
  if(d.week.current&&byCode[d.week.current])d.week.current=byCode[d.week.current];
  if(d.week.next&&byCode[d.week.next])d.week.next=byCode[d.week.next];
  return d;
}
function isV6(o){return o&&o.version>=8&&Array.isArray(o.subjects)&&o.subjects.length&&o.subjects[0].id}
function adopt(o){
  if(isV6(o)){
    var d=defaults();
    ["subjects","types","materials","records","milestones","results","timeTemplates"].forEach(function(k){
      d[k]=o[k]||[]});
    d.config=Object.assign(d.config,o.config||{});
    d.weekPlan=o.weekPlan||{}; d.weekTemplate=o.weekTemplate||{};
    d.week=o.week||d.week;
    if(!THEMES[d.config.theme])d.config.theme="kinari";
    return d;
  }
  return migrate(o);
}
function load(){
  var raw=null; try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){ try{ S=adopt(JSON.parse(raw)); }catch(e){ S=defaults(); } }
  else S=defaults();
  fill(); applyTheme();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(Object.assign({app:"sharoushi-study-manager",version:VER},S)))}catch(e){}}

function fill(){
  var c=S.config;
  if(c.spareDays==null)c.spareDays=7;
  if(c.targetHours==null)c.targetHours=1000;
  if(c.cyclePeriod==null)c.cyclePeriod=70;
  if(!THEMES[c.theme])c.theme="kinari";
  if(!c.startDate)c.startDate=todayISO();
  if(!S.timeTemplates.length)S.timeTemplates=[{id:"tt"+uid(),name:"仕事の日",blocks:[]}];
  if(!S.weekTemplate)S.weekTemplate={};
  if(!S.weekPlan)S.weekPlan={};
  if(!S.week)S.week={start:"",current:"",next:"",memo:""};
  syncWeek();
}
function weekStart(iso){var d=dow(iso);return addD(iso,-((d-2+7)%7))}
function syncWeek(){
  var ws=weekStart(todayISO());
  if(S.week.start!==ws){
    if(S.week.start){ S.week.current=S.week.next||S.week.current; S.week.next=""; S.week.memo=""; }
    S.week.start=ws; save();
  }
}

/* ---------- lookups ---------- */
function subj(id){return S.subjects.filter(function(s){return s.id===id})[0]||null}
function typ(id){return S.types.filter(function(t){return t.id===id})[0]||null}
function sName(id){var s=subj(id);return s?s.name:"—"}
function tName(id){var t=typ(id);return t?t.name:"—"}
function sColor(id){var s=subj(id);return s?s.color:"#8A8A8E"}
function tColor(id){var t=typ(id);return t?t.color:"#8A8A8E"}
function tHidden(id){var t=typ(id);return t?!!t.hidden:false}
function matHidden(m){return !!m.hidden||tHidden(m.typeId)}
function isQuota(m){
  if(matHidden(m))return false;
  if(m.quota===true||m.quota===false)return m.quota;
  var t=typ(m.typeId); return t?!!t.quota:false;
}
function spare(){return Math.max(0,+S.config.spareDays||0)}
function effDL(iso){return addD(iso,-spare())}
function cyclePeriod(){return Math.max(1,+S.config.cyclePeriod||70)}

/* ---------- laps ---------- */
function lapSegments(recs,sid,tid){
  var rows=recs.filter(function(r){return r.subjectId===sid&&r.typeId===tid})
    .slice().sort(function(a,b){return a.date===b.date?((a.done?1:0)-(b.done?1:0)):(a.date<b.date?-1:1)});
  var segs=[],cur=null;
  rows.forEach(function(r){
    if(!cur)cur={problems:0,minutes:0,done:false,first:null,last:null};
    cur.problems+=r.problems||0; cur.minutes+=r.minutes||0;
    if(cur.first==null)cur.first=r.date; cur.last=r.date;
    if(r.done){cur.done=true;if(r.lapTotal!=null&&+r.lapTotal>0)cur.problems=+r.lapTotal;segs.push(cur);cur=null}
  });
  if(cur)segs.push(cur);
  segs.forEach(function(s,i){s.lap=i+1});
  return segs;
}
function openSeg(sid,tid){var s=lapSegments(S.records,sid,tid);var l=s[s.length-1];return l&&!l.done?l:null}
function lastDone(sid,tid){
  var s=lapSegments(S.records,sid,tid).filter(function(x){return x.done});
  return s.length?s[s.length-1].last:null;
}
function progress(mat,recs){
  var segs=lapSegments(recs,mat.subjectId,mat.typeId);
  var doneSegs=segs.filter(function(s){return s.done});
  var maxC=doneSegs.length, cur=maxC+1, target=mat.targetLaps||0;
  var lap1=(mat.lap1Problems===""||mat.lap1Problems==null)?null:+mat.lap1Problems;
  var predicted=doneSegs.length?doneSegs[doneSegs.length-1].problems:lap1;
  if(!predicted&&lap1)predicted=lap1;
  var ready=!!(predicted&&predicted>0), remaining=0;
  if(ready&&target>maxC){
    var inProg=segs.length>maxC?segs[segs.length-1].problems:0;
    if(segs.length&&segs[segs.length-1].done)inProg=0;
    remaining+=Math.max(0,predicted-inProg);
    var future=target-cur; if(future>0)remaining+=predicted*future;
  }
  return {remaining:remaining,current:cur,maxCompleted:maxC,predicted:predicted,ready:ready,target:target};
}

/* ---------- milestones / quota ---------- */
function nextMS(){
  var t=todayISO();
  return S.milestones.slice().filter(function(m){return m.date>=t})
    .sort(function(a,b){return a.date<b.date?-1:1})[0]||null;
}
function prevMSEnd(){
  var t=todayISO();
  var p=S.milestones.slice().filter(function(m){return effDL(m.date)<t})
    .sort(function(a,b){return a.date<b.date?-1:1});
  return p.length?effDL(p[p.length-1].date):S.config.startDate;
}
function totalRemaining(){
  var st=S.config.startDate, recs=st?S.records.filter(function(r){return r.date>=st}):S.records;
  var sum=0;
  S.materials.forEach(function(m){
    if(!isQuota(m))return;
    var p=progress(m,recs); if(p.ready)sum+=p.remaining;
  });
  return sum;
}
/* ノルマ母数：期間内の日のうち、割り当て種別がノルマ対象である日数。曜日そのものは条件でない */
function dayIsQuota(iso){
  var ti=S.weekPlan[dow(iso)];
  if(!ti)return false;
  var t=typ(ti);
  return !!(t&&t.quota&&!t.hidden);
}
function quotaDays(fromISO,toISO){
  if(!fromISO||!toISO||toISO<fromISO)return 0;
  var n=0,d=fromISO;
  var span=days(fromISO,toISO);
  if(span>2000)return 0;
  for(var i=0;i<=span;i++){ if(dayIsQuota(d))n++; d=addD(d,1); }
  return n;
}
function dailyQuota(){
  var nm=nextMS(); if(!nm)return null;
  var dl=effDL(nm.date), t=todayISO();
  if(dl<t)return null;
  var n=quotaDays(t,dl);
  if(!n)return null;
  return Math.ceil(totalRemaining()/n);
}
function msLeftDays(){
  var nm=nextMS(); if(!nm)return null;
  return Math.max(0,days(todayISO(),effDL(nm.date)));
}

/* ---------- priority ---------- */
function priority(){
  var out=[];
  S.materials.forEach(function(m){
    if(!isQuota(m))return;
    var ld=lastDone(m.subjectId,m.typeId);
    out.push({subjectId:m.subjectId,typeId:m.typeId,name:sName(m.subjectId),type:tName(m.typeId),
      last:ld,ago:ld?days(ld,todayISO()):null});
  });
  out.sort(function(a,b){
    if(a.last==null&&b.last==null)return 0;
    if(a.last==null)return -1; if(b.last==null)return 1;
    return a.last<b.last?-1:1;
  });
  return out;
}
function prioritySubjects(){
  var by={};
  priority().forEach(function(r){
    var s=subj(r.subjectId); if(!s||s.hidden)return;
    if(!by[r.subjectId])by[r.subjectId]={id:r.subjectId,name:r.name,last:r.last,ago:r.ago};
    else{ var c=by[r.subjectId];
      if(r.last==null||(c.last!=null&&r.last<c.last)){c.last=r.last;c.ago=r.ago} }
  });
  var arr=Object.keys(by).map(function(k){return by[k]});
  arr.sort(function(a,b){
    if(a.last==null&&b.last==null)return 0;
    if(a.last==null)return -1; if(b.last==null)return 1;
    return a.last<b.last?-1:1;});
  return arr;
}
function minutesOn(iso){var s=0;S.records.forEach(function(r){if(r.date===iso)s+=r.minutes||0});return s}
function problemsOn(iso){var s=0;S.records.forEach(function(r){if(r.date===iso)s+=r.problems||0});return s}
function totalMinutes(){var s=0,st=S.config.startDate;
  S.records.forEach(function(r){if(!st||r.date>=st)s+=r.minutes||0});return s}

/* ---------- time templates ---------- */
function ttById(id){return S.timeTemplates.filter(function(t){return t.id===id})[0]||null}
function ttForDow(d){return ttById(S.weekTemplate[d])||null}
function ttMinutes(tt){
  if(!tt)return 0;
  return (tt.blocks||[]).reduce(function(a,b){var s=parseHHMM(b.start),e=parseHHMM(b.end);return a+(e>s?e-s:0)},0);
}

/* ---------- 時間統計の集計 ---------- */
/* 粒度: day / week / month / ms / all  →  {from,to,bucket} */
function statRange(gran){
  var t=todayISO(), st=S.config.startDate||t;
  if(gran==="day")  return {from:addD(t,-13),to:t,bucket:"day",label:"直近14日"};
  if(gran==="week") return {from:weekStart(addD(t,-7*11)),to:t,bucket:"week",label:"直近12週"};
  if(gran==="month"){var f=addD(t,0).slice(0,7)+"-01";
    var y=+f.slice(0,4),m=+f.slice(5,7)-11;while(m<1){m+=12;y--}
    return {from:y+"-"+pad(m)+"-01",to:t,bucket:"month",label:"直近12ヶ月"};}
  if(gran==="ms"){var nm=nextMS();var from=prevMSEnd(),to=nm?effDL(nm.date):t;
    if(to>t)to=t;
    return {from:from,to:to,bucket:"week",label:nm?("今期："+nm.name+"まで"):"今期"};}
  var first=st;
  S.records.forEach(function(r){if(r.date&&r.date<first)first=r.date});
  return {from:first,to:t,bucket:"month",label:"全期間"};
}
function bucketKey(iso,bucket){
  if(bucket==="day")return iso;
  if(bucket==="week")return weekStart(iso);
  return iso.slice(0,7);
}
function bucketLabel(key,bucket){
  if(bucket==="day")return md(key);
  if(bucket==="week")return md(key);
  return (+key.slice(5,7))+"月";
}
/* axis: "subject" | "type" → {buckets:[{key,label,total,parts:{id:min}}], totals:[{id,name,color,min}]} */
function aggregate(gran,axis){
  var R=statRange(gran), out=[], idx={}, tot={};
  var d=R.from, guard=0;
  while(d<=R.to&&guard++<800){
    var k=bucketKey(d,R.bucket);
    if(!idx[k]){idx[k]={key:k,label:bucketLabel(k,R.bucket),total:0,parts:{}};out.push(idx[k])}
    d=addD(d,1);
  }
  S.records.forEach(function(r){
    if(r.date<R.from||r.date>R.to)return;
    var k=bucketKey(r.date,R.bucket); if(!idx[k])return;
    var id=axis==="subject"?r.subjectId:r.typeId;
    var mn=r.minutes||0; if(!mn)return;
    idx[k].parts[id]=(idx[k].parts[id]||0)+mn;
    idx[k].total+=mn;
    tot[id]=(tot[id]||0)+mn;
  });
  var totals=Object.keys(tot).map(function(id){
    return {id:id,min:tot[id],
      name:axis==="subject"?sName(id):tName(id),
      color:axis==="subject"?sColor(id):tColor(id)};
  }).sort(function(a,b){return b.min-a.min});
  return {range:R,buckets:out,totals:totals,axisSubject:(axis==="subject"),grand:totals.reduce(function(a,x){return a+x.min},0)};
}

/* ---------- charts (inline svg) ---------- */
function barChart(ag){
  var bs=ag.buckets; if(!bs.length||!ag.grand)return '<div class="empty">この期間に記録がありません。</div>';
  var bw=Math.max(22,Math.min(46,Math.floor(430/bs.length)));
  var W=Math.max(320,bs.length*bw+44), H=190, top=14, bot=32, ph=H-top-bot;
  var max=Math.max.apply(null,bs.map(function(b){return b.total}))||1;
  var step=max<=120?30:max<=360?60:max<=720?120:max<=1800?300:600;
  var g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">';
  for(var v=0;v<=max;v+=step){
    var y=top+ph-(v/max*ph);
    g+='<line x1="38" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="var(--line2)" stroke-width="1"/>'+
       '<text x="34" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--faint)">'+(v/60)+'h</text>';
  }
  bs.forEach(function(b,i){
    var x=44+i*bw, w=bw-6, acc=0;
    var ids=Object.keys(b.parts).sort(function(a,c){return b.parts[c]-b.parts[a]});
    ids.forEach(function(id){
      var mn=b.parts[id], h=mn/max*ph;
      acc+=h;
      var y=top+ph-acc;
      g+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+w+'" height="'+Math.max(1,h).toFixed(1)+
         '" fill="'+(ag.axisSubject?sColor(id):tColor(id))+'" rx="1.5"><title>'+
         esc(b.label)+' '+esc(ag.axisSubject?sName(id):tName(id))+' '+fmtHMs(mn)+'</title></rect>';
    });
    if(b.total)g+='<text x="'+(x+w/2)+'" y="'+(top+ph-acc-4).toFixed(1)+'" text-anchor="middle" font-size="8.5" fill="var(--faint)">'+
      (b.total>=60?Math.round(b.total/60*10)/10+"h":b.total+"m")+'</text>';
    var every=bs.length>16?Math.ceil(bs.length/12):1;
    if(i%every===0)g+='<text x="'+(x+w/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="var(--faint)">'+esc(b.label)+'</text>';
  });
  return g+'</svg>';
}
function pieChart(ag){
  var ts=ag.totals.filter(function(t){return t.min>0});
  if(!ts.length)return '<div class="empty">この期間に記録がありません。</div>';
  var cx=88,cy=88,r=76,ir=40,acc=-Math.PI/2,g='<svg viewBox="0 0 176 176" width="176" height="176" xmlns="http://www.w3.org/2000/svg">';
  ts.forEach(function(t){
    var frac=t.min/ag.grand, a=frac*Math.PI*2, e=acc+a;
    if(frac>=0.9999){
      g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r+ir)/2)+'" fill="none" stroke="'+t.color+'" stroke-width="'+(r-ir)+'"/>';
      acc=e; return;
    }
    var p=function(ang,rad){return [(cx+Math.cos(ang)*rad).toFixed(2),(cy+Math.sin(ang)*rad).toFixed(2)]};
    var a1=p(acc,r),a2=p(e,r),b1=p(e,ir),b2=p(acc,ir),la=a>Math.PI?1:0;
    g+='<path d="M'+a1[0]+' '+a1[1]+' A'+r+' '+r+' 0 '+la+' 1 '+a2[0]+' '+a2[1]+
       ' L'+b1[0]+' '+b1[1]+' A'+ir+' '+ir+' 0 '+la+' 0 '+b2[0]+' '+b2[1]+' Z" fill="'+t.color+'">'+
       '<title>'+esc(t.name)+' '+fmtHMs(t.min)+'</title></path>';
    acc=e;
  });
  g+='<text x="88" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">'+Math.round(ag.grand/60)+'</text>'+
     '<text x="88" y="100" text-anchor="middle" font-size="9" fill="var(--faint)">時間</text>';
  return g+'</svg>';
}
function legend(ag){
  return '<div class="lgd">'+ag.totals.filter(function(t){return t.min>0}).map(function(t){
    var pc=ag.grand?Math.round(t.min/ag.grand*100):0;
    return '<span><i class="dot" style="background:'+t.color+'"></i>'+esc(t.name)+
      ' <b class="num" style="color:var(--ink)">'+fmtHMs(t.min)+'</b> '+pc+'%</span>';

/* ---------- shared blocks ---------- */
function hmColor(m,future){
  if(future)return "var(--hmFuture)";
  if(!m)return "var(--hmEmpty)";
  if(m<90){var r=Math.min(1,m/90);
    var mix=function(a,b){return Math.round(a+(b-a)*r)};
    return "rgb("+mix(0xF6,0xE8)+","+mix(0xD9,0x6A)+","+mix(0xD5,0x5E)+")"}
  if(m<180)return "#E8C15E";
  return "#5CB98A";
}
function heatmap(){
  var st=S.config.startDate,en=S.config.examDate,t=todayISO();
  if(!st||!en||en<st)return '<div class="empty">起算日と受験日を設定してください。</div>';
  var by={};S.records.forEach(function(r){by[r.date]=(by[r.date]||0)+(r.minutes||0)});
  var months=[],ym=st.slice(0,7),endYM=en.slice(0,7);
  while(ym<=endYM){months.push(ym);
    var y=+ym.slice(0,4),m=+ym.slice(5,7);m++;if(m>12){m=1;y++}ym=y+"-"+pad(m)}
  var h='<div class="hm">';
  months.forEach(function(ym){
    var y=+ym.slice(0,4),mo=+ym.slice(5,7);
    var lead=(new Date(Date.UTC(y,mo-1,1)).getUTCDay()+6)%7;
    var nd=new Date(Date.UTC(y,mo,0)).getUTCDate();
    h+='<div class="hmM"><div class="lb">'+(mo===1?y+"年1月":mo+"月")+'</div><div class="hmG">';
    for(var i=0;i<42;i++){
      var day=i-lead+1;
      if(day<1||day>nd){h+='<i></i>';continue}
      var iso=ym+"-"+pad(day);
      if(iso<st||iso>en){h+='<i></i>';continue}
      h+='<i title="'+iso+'" style="background:'+hmColor(by[iso]||0,iso>t)+
        (iso===t?';box-shadow:0 0 0 1.5px var(--ink)':'')+'"></i>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}
function heatCard(){

/* ---------- 今日 ---------- */

  var R=34,C=2*Math.PI*R;
  var html='<div class="head"><div>'+
    '<div class="eyebrow">'+(+t.slice(5,7))+'月'+(+t.slice(8,10))+'日('+WD[dow(t)]+')・本試験まで'+

    (nm?'<div class="chip"><span class="cs">'+esc(nm.name)+'（'+md(effDL(nm.date))+'）</span>'+
        '<span class="num" style="font-size:17px;font-weight:800">あと'+left+'日</span></div>':'')+
    '</div>';

  html+='<div class="card"><div class="ring">'+
    '<svg width="82" height="82" viewBox="0 0 82 82">'+
      '<circle cx="41" cy="41" r="'+R+'" fill="none" stroke="var(--track)" stroke-width="8"/>'+
      '<circle cx="41" cy="41" r="'+R+'" fill="none" stroke="'+(pct>=100?"var(--good)":"var(--ink)")+'" stroke-width="8"'+
      ' stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"'+
      ' transform="rotate(-90 41 41)"/>'+
      '<text x="41" y="46" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)" class="num">'+pct+'</text>'+
    '</svg><div><div class="t1">MS：今日のノルマ</div>'+
    '<div class="t2 num">'+pt+' / '+(dq==null?"—":dq)+' 問　・　'+fmtHM(mt)+'</div></div></div></div>';

      (todayType?'　'+esc(tName(todayType)):'')+'</div>'+
      '<div class="meta">'+WD[dow(t)]+'曜は「'+esc(todayType?tName(todayType):"—")+'」の日'+
      (dayIsQuota(t)?'':'・ノルマ母数から外れる日')+'</div>';
  }else{
    html+='<div class="lab">まだ今週の科目が決まっていません</div>'+
      '<div class="big">今週の科目を<br>選びましょう</div>'+
      '<div class="meta">最終周回日が古い科目から候補を出します</div>';
  }
  html+='<button class="btn" data-sheet="'+(cur?"rec":"pick")+'">'+(cur?"記録する":"科目を選ぶ")+'</button></div>';

  html+='<div class="tiles">'+
    tile(pri[0]?pri[0].name:"—","","最優先の科目")+
    tile(late,"科目","周期を超過")+
    tile(Math.round(totalMinutes()/60),"h","累計学習")+'</div>';

  html+='<div class="card"><h2>最終周回日が古い順</h2>';
  html+=pri.slice(0,5).map(function(r){

  var prev=passed.length?passed[passed.length-1]:null;
  var curMS=S.milestones.slice().map(function(m){return {m:m,eff:effDL(m.date)}})
    .filter(function(x){return x.eff>=t}).sort(function(a,b){return a.eff<b.eff?-1:1})[0];
  if(curMS&&(curMS.m.plan||"").trim())
    html+='<div class="okbox"><b>今期の計画（'+esc(curMS.m.name)+'）</b><br>'+esc(curMS.m.plan)+'</div>';

    html+='<div class="warnbox"><b>「'+esc(prev.m.name)+'」の総括が空欄です。</b><br>下のマイルストーンで振り返りを書いてください。</div>';

    html+='<div class="okbox"><b>今期の意識事項</b><br>'+esc(prev.m.nextFocus)+'</div>';

  html+='<div class="row"><span class="nm">来週の候補</span>'+
    '<button class="pill b" data-sheet="pick">'+(S.week.next?esc(sName(S.week.next)):"選ぶ")+'</button></div>';
  html+='<label class="f" style="margin-top:12px"><span>メモ（週が変わると消えます）</span>'+
    '<textarea class="inp" rows="3" data-week="memo" placeholder="例：健保は保険給付から。徴収は労一の合間に。">'+esc(S.week.memo)+'</textarea></label>';
  html+='<div class="hint">最終周回日が古い順の候補：'+pri.map(function(p){
    return esc(p.name)+"("+(p.last==null?"未":p.ago+"日")+")"}).join("・")+'</div></div>';

  /* 曜日ごと：教材種別＋時間テンプレート */

  WEEK_ORDER.forEach(function(d){
    html+='<div class="row" style="gap:6px"><span class="dot" style="background:'+

      '<span class="nm" style="flex:none;width:34px">'+WD[d]+'曜</span>'+
      '<select class="inp" style="flex:1;padding:7px 26px 7px 10px;font-size:12.5px" data-wp="'+d+'">'+
      '<option value="">—</option>'+S.types.filter(function(ty){return !ty.hidden}).map(function(ty){
        return '<option value="'+esc(ty.id)+'"'+(S.weekPlan[d]===ty.id?" selected":"")+'>'+esc(ty.name)+'</option>'
      }).join("")+'</select>'+
      '<select class="inp" style="flex:1;padding:7px 26px 7px 10px;font-size:12.5px" data-wt="'+d+'">'+
      '<option value="">—</option>'+S.timeTemplates.map(function(tt){
        return '<option value="'+esc(tt.id)+'"'+(S.weekTemplate[d]===tt.id?" selected":"")+'>'+esc(tt.name)+'</option>'
      }).join("")+'</select></div>';
  });
  html+='<div class="hint">左＝その日にやる教材種別、右＝その日の時間テンプレート。ノルマ対象外の種別を置いた日は、ノルマの母数から自動で外れます。</div></div>';

  html+=vesselCard();

  /* 時間テンプレート編集 */

  var tt=ttById(planKind);
  html+='<div class="card"><h2>時間テンプレート</h2>';
  html+='<div class="seg sm" style="margin-bottom:14px;flex-wrap:wrap">'+
    S.timeTemplates.map(function(x){
      return '<button data-kind="'+esc(x.id)+'" class="'+(planKind===x.id?"on":"")+'">'+esc(x.name)+'</button>'
    }).join("")+'</div>';
  if(tt){
    html+='<label class="f"><span>テンプレート名</span><input class="inp" data-ttn="'+esc(tt.id)+'" value="'+esc(tt.name)+'"></label>';
    var blocks=tt.blocks||[];
    html+='<div style="position:relative;height:40px;background:var(--track);border-radius:10px;overflow:hidden;margin-bottom:4px">';
    [0,6,12,18,24].forEach(function(h){html+='<i style="position:absolute;top:0;bottom:0;width:1px;background:var(--line);left:'+(h/24*100)+'%"></i>'});
    blocks.forEach(function(b){var s=parseHHMM(b.start),e=parseHHMM(b.end);if(e<=s)return;
      html+='<i style="position:absolute;top:7px;bottom:7px;background:var(--ink);border-radius:3px;left:'+(s/1440*100)+'%;width:'+((e-s)/1440*100)+'%"></i>'});
    html+='</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-bottom:12px" class="num"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>';
    blocks.forEach(function(b,i){
      var s=parseHHMM(b.start),e=parseHHMM(b.end),len=e>s?e-s:0;
      html+='<div class="row"><input class="inp num" style="width:76px;padding:8px 10px" inputmode="numeric" maxlength="4" placeholder="0600" value="'+esc(b.start)+'" data-blk="'+i+'" data-f="start">'+
        '<span style="color:var(--faint)">→</span>'+
        '<input class="inp num" style="width:76px;padding:8px 10px" inputmode="numeric" maxlength="4" placeholder="0730" value="'+esc(b.end)+'" data-blk="'+i+'" data-f="end">'+
        '<span class="pill" style="'+(len?"":"color:var(--bad);border-color:var(--bad)")+'">'+(len?fmtHM(len):"要修正")+'</span>'+
        '<button class="x" data-delblk="'+i+'">×</button></div>';
    });
    html+='<button class="add" data-addblk="1" style="margin-top:8px">＋ 枠を追加</button>';
    html+='<div class="g2" style="margin-top:10px">'+
      '<button class="ghost" data-addtt="1">＋ テンプレートを追加</button>'+
      '<button class="ghost" data-deltt="'+esc(tt.id)+'" style="color:var(--bad)">このテンプレを削除</button></div>';
    html+='<div class="hint">HHMM で入力（0600 → 6:00）。曜日ごとの割り当ては上のブロックで変えられます。</div>';
  }
  html+='</div>';

  /* MS */
  html+='<div class="card"><h2>マイルストーン</h2>';
  S.milestones.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(m){
    var done=effDL(m.date)<t, empty=done&&!(m.review||"").trim();
    html+='<div style="border:1px solid '+(empty?"var(--bad)":"var(--line)")+';border-radius:13px;padding:12px 13px;margin-bottom:9px">'+
      '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:9px">'+
      '<b style="font-size:14.5px">'+esc(m.name)+'</b><span class="sm num">'+md(effDL(m.date))+'</span>'+
      '<span class="pill" style="margin-left:auto;'+(empty?"color:var(--bad);border-color:var(--bad)":"")+'">'+
      (done?(empty?"総括が空欄":"総括あり"):"これから")+'</span></div>'+
      '<label class="f"><span>この期間の計画</span><textarea class="inp" rows="2" data-ms="'+m.id+'" data-f="plan">'+esc(m.plan)+'</textarea></label>'+
      (done?'<label class="f"><span>振り返り</span><textarea class="inp" rows="2" data-ms="'+m.id+'" data-f="review">'+esc(m.review)+'</textarea></label>'+
      '<label class="f" style="margin-bottom:0"><span>次で気を付ける事</span><textarea class="inp" rows="2" data-ms="'+m.id+'" data-f="nextFocus">'+esc(m.nextFocus)+'</textarea></label>':'')+
      '</div>';
  });
  html+='</div>';
  return html;
}

/* ---------- 記録 ---------- */
var F={date:"",subjectId:"",typeId:"",problems:"",times:[""],done:false,memo:"",loaded:""};
function vRec(){
  var visT=S.types.filter(function(t){return !t.hidden});
  var visS=S.subjects.filter(function(s){return !s.hidden});
  if(!F.date)F.date=todayISO();
  if(!F.subjectId||!subj(F.subjectId))F.subjectId=(visS[0]||{}).id||"";
  if(!F.typeId||!typ(F.typeId))F.typeId=(visT[0]||{}).id||"";
  if(!F.times||!F.times.length)F.times=[""];
  var op=openSeg(F.subjectId,F.typeId);
  var lapNo=lapSegments(S.records,F.subjectId,F.typeId).length+(op?0:1);
  var ex=S.records.filter(function(r){return r.date===F.date&&r.subjectId===F.subjectId&&r.typeId===F.typeId})[0];
  var sig=F.date+"|"+F.subjectId+"|"+F.typeId;
  if(F.loaded!==sig){
    F.loaded=sig;
    if(ex){ F.problems=String(ex.problems||"");
      F.times=[ex.minutes?pad(Math.floor(ex.minutes/60))+pad(ex.minutes%60):""];
      F.done=!!ex.done; F.memo=ex.memo||"";
    }else{ F.problems="";F.times=[""];F.done=false;F.memo=""; }
  }
  var tsum=F.times.reduce(function(a,s){return a+parseHHMM(s)},0);

  var html='<div class="head"><div><div class="eyebrow">数字ふたつと、チェックひとつ</div><h1>記録</h1></div></div>';
  html+='<div class="card">'+
    '<label class="f"><span>日付</span><input type="date" class="inp" data-f="date" value="'+esc(F.date)+'"></label>'+
    '<div class="g2">'+
      '<label class="f"><span>科目</span><select class="inp" data-f="subjectId">'+
        visS.map(function(s){return '<option value="'+esc(s.id)+'"'+(F.subjectId===s.id?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+
      '</select></label>'+
      '<label class="f"><span>教材</span><select class="inp" data-f="typeId">'+
        visT.map(function(ty){return '<option value="'+esc(ty.id)+'"'+(F.typeId===ty.id?" selected":"")+'>'+esc(ty.name)+'</option>'}).join("")+
      '</select></label>'+
    '</div>'+
    '<label class="f"><span>解いた問題数（その日の累計をそのまま）</span>'+
      '<input class="inp num" inputmode="numeric" data-f="problems" value="'+esc(F.problems)+'" placeholder="アプリに出ている数字"></label>'+
    '<div style="margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">'+
        '<span style="font-size:12px;color:var(--sub)">学習時間 HHMM</span>'+
        '<span class="num" style="font-size:12.5px;color:'+(tsum?"var(--ink)":"var(--faint)")+';font-weight:600">合計 '+(tsum?fmtHM(tsum):"—")+'</span></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:7px">'+
      F.times.map(function(t,i){
        return '<div style="display:flex;align-items:center;gap:4px">'+
          '<input class="inp num" style="width:80px;padding:10px" inputmode="numeric" maxlength="4" data-tm="'+i+'" value="'+esc(t)+'" placeholder="0130">'+
          (F.times.length>1?'<button class="x" data-deltm="'+i+'">−</button>':'')+'</div>'}).join("")+
      '<button class="add" style="width:46px;padding:10px 0" data-addtm="1">＋</button>'+
      '</div></div>'+
    '<label class="f"><span>メモ（次回の引き継ぎ）</span><input class="inp" data-f="memo" value="'+esc(F.memo)+'" placeholder="例：次は312番から"></label>'+
    '<button class="toggle'+(F.done?" on":"")+'" data-toggledone="1">'+(F.done?"✓ この周を完了にする":"この周は継続中")+'</button>'+
    '<div class="hint">いま '+esc(sName(F.subjectId))+'・'+esc(tName(F.typeId))+' は '+lapNo+'周目'+
      (op?'（この周ここまで '+op.problems+'問）':'（新しい周）')+'。'+
      (ex?'<br><b style="color:var(--warn)">この日のこの教材には既に記録があります。保存すると上書きします。</b>'
         :'<br>細切れに解いた日も、夜にアプリの累計を写すだけで足ります。')+'</div>'+
    '<div style="margin-top:14px"><button class="primary" data-submit="1">'+(ex?"上書きする":"記録する")+'</button></div>'+
  '</div>';

  /* 履歴：年 → 月 → 日 → 明細 */
  var byY={};
  S.records.forEach(function(r){
    var y=r.date.slice(0,4), m=r.date.slice(0,7);
    if(!byY[y])byY[y]={min:0,prob:0,months:{}};
    if(!byY[y].months[m])byY[y].months[m]={min:0,prob:0,days:{}};
    if(!byY[y].months[m].days[r.date])byY[y].months[m].days[r.date]={min:0,prob:0,rows:[]};
    var Y=byY[y],M=Y.months[m],D=M.days[r.date];
    [Y,M,D].forEach(function(o){o.min+=r.minutes||0;o.prob+=r.problems||0});
    D.rows.push(r);
  });
  var years=Object.keys(byY).sort().reverse();
  html+='<div class="card"><h2>これまでの記録</h2>';
  if(!years.length)html+='<div class="empty">まだ記録がありません。</div>';
  years.forEach(function(y){
    var Y=byY[y], openY=recOpenY===y;
    html+='<div class="row" data-openy="'+y+'"><span class="sm" style="width:11px">'+(openY?"▾":"▸")+'</span>'+
      '<span class="nm num" style="font-weight:700">'+y+'年</span>'+
      (Y.prob?'<span class="pill num">'+Y.prob+'問</span>':'')+
      '<span class="pill num">'+fmtHMs(Y.min)+'</span></div>';
    if(!openY)return;
    Object.keys(Y.months).sort().reverse().forEach(function(m){
      var M=Y.months[m], openM=recOpenM===m;
      html+='<div class="row" style="padding-left:18px" data-openm="'+m+'"><span class="sm" style="width:11px">'+(openM?"▾":"▸")+'</span>'+
        '<span class="nm num">'+(+m.slice(5,7))+'月</span>'+
        (M.prob?'<span class="pill num">'+M.prob+'問</span>':'')+
        '<span class="pill num">'+fmtHMs(M.min)+'</span></div>';
      if(!openM)return;
      Object.keys(M.days).sort().reverse().forEach(function(d){
        var D=M.days[d], openD=recOpenD===d;
        html+='<div class="row" style="padding-left:36px" data-opend="'+d+'"><span class="sm" style="width:11px">'+(openD?"▾":"▸")+'</span>'+
          '<span class="nm num">'+md(d)+'<span class="sm" style="margin-left:7px">'+WD[dow(d)]+'</span></span>'+
          (D.prob?'<span class="pill num">'+D.prob+'問</span>':'')+
          (D.min?'<span class="pill num">'+fmtHMs(D.min)+'</span>':'')+'</div>';
        if(!openD)return;
        D.rows.forEach(function(r){
          html+='<div class="row" style="padding-left:54px">'+
            '<span class="dot" style="background:'+tColor(r.typeId)+'"></span>'+
            '<span class="nm">'+esc(sName(r.subjectId))+' <span class="sm">'+esc(tName(r.typeId))+'</span></span>'+
            (r.problems?'<span class="pill num">'+r.problems+'問</span>':'')+
            (r.minutes?'<span class="pill num">'+fmtHMs(r.minutes)+'</span>':'')+
            (r.done?'<span class="pill" style="color:var(--good);border-color:var(--good)">完了</span>':'')+
            '<button class="x" data-del="'+r.id+'">×</button></div>';
          if(r.memo)html+='<div class="sm" style="padding:0 0 9px 74px;color:var(--faint)">'+esc(r.memo)+'</div>';
        });
      });
    });
  });
  html+='<div class="hint">年をたたむと全部たたまれます。非表示にした教材の記録もここには残ります。</div></div>';
  return html;
}

/* ---------- 統計 ---------- */
function vStat(){
  var t=todayISO(), cyc=cyclePeriod();
  var html='<div class="head"><div><div class="eyebrow">教材をまたいだ横断ビュー</div><h1>統計</h1></div></div>';

  html+=heatCard();

  var tm=totalMinutes(),goal=(+S.config.targetHours||1000)*60, sc=Math.max(goal,tm);
  html+='<div class="card"><h2>学習時間</h2>'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">'+
    '<span class="num" style="font-size:26px;font-weight:800">'+fmtHM(tm)+'</span>'+
    '<span class="sm num">目安 '+(+S.config.targetHours||1000)+'時間</span></div>'+
    '<div class="gauge"><i style="width:'+(tm/sc*100)+'%;background:var(--ink)"></i>'+
    '<b style="left:'+(goal/sc*100)+'%"></b></div></div>';

  /* 時間統計 */
  var ag=aggregate(statGran,statAxis); ag.axisSubject=(statAxis==="subject");
  var GR=[["day","日"],["week","週"],["month","月"],["ms","MS"],["all","全期間"]];
  html+='<div class="card"><h2>時間統計 — 推移</h2>'+
    '<div class="seg sm" style="margin-bottom:8px">'+GR.map(function(g){
      return '<button data-gran="'+g[0]+'" class="'+(statGran===g[0]?"on":"")+'">'+g[1]+'</button>'}).join("")+'</div>'+
    '<div class="seg sm" style="margin-bottom:12px">'+
      '<button data-axis="subject" class="'+(statAxis==="subject"?"on":"")+'">科目別</button>'+
      '<button data-axis="type" class="'+(statAxis==="type"?"on":"")+'">教材別</button></div>'+
    '<div class="chartwrap">'+barChart(ag)+'</div>'+
    '<div class="hint">'+esc(ag.range.label)+'（'+md(ag.range.from)+'–'+md(ag.range.to)+'）。'+
    'ノルマ対象外の教材も含めた、実際に使った時間です。</div></div>';

  html+='<div class="card"><h2>時間統計 — 配分</h2>'+
    '<div style="display:flex;justify-content:center">'+pieChart(ag)+'</div>'+
    legend(ag)+
    '<div class="hint">上の粒度・軸の切替と連動します。</div></div>';

  /* 優先度 */
  html+='<div class="card"><h2>優先度（最終周回日）</h2>';
  var pr=priority();
  if(!pr.length)html+='<div class="empty">ノルマ対象の教材がありません。</div>';
  pr.forEach(function(r,i){
    var over=r.last==null||r.ago>=cyc;
    html+='<div class="row"'+(i<3?' style="background:var(--inpbg);border-radius:9px;padding-left:8px;padding-right:8px"':'')+'>'+
      '<span class="dot" style="background:'+sColor(r.subjectId)+'"></span>'+
      '<span class="nm">'+esc(r.name)+' <span class="sm">'+esc(r.type)+'</span></span>'+
      '<span class="sm num">'+(r.last?md(r.last):"")+'</span>'+
      '<span class="num" style="font-size:13px;min-width:52px;text-align:right;color:'+
        (over?"var(--bad)":"var(--faint)")+';font-weight:'+(over?700:400)+'">'+
        (r.last==null?"未着手":r.ago+"日前")+'</span></div>';
  });
  html+='<div class="hint">上位3件が来週の候補。周期'+cyc+'日を超えたら赤で出ます。非表示・ノルマ対象外の教材はここに出ません。</div></div>';

  /* ノルマ表 */
  var st=S.config.startDate,recs=st?S.records.filter(function(r){return r.date>=st}):S.records;
  var nm=nextMS(),dl=nm?effDL(nm.date):null,dd=dl?quotaDays(t,dl):null;
  html+='<div class="card"><h2>残りと1日ノルマ'+(nm?'（'+esc(nm.name)+'までノルマ日'+dd+'日）':'')+'</h2>';
  var any=false;
  S.materials.forEach(function(m){
    if(!isQuota(m))return;
    var p=progress(m,recs); if(!p.ready)return; any=true;
    html+='<div class="row"><span class="dot" style="background:'+tColor(m.typeId)+'"></span>'+
      '<span class="nm">'+esc(sName(m.subjectId))+' <span class="sm">'+esc(tName(m.typeId))+'</span></span>'+
      '<span class="sm num">'+p.maxCompleted+'/'+p.target+'周</span>'+
      '<span class="pill num">'+p.remaining+'問</span>'+
      '<span class="num" style="font-size:13px;min-width:38px;text-align:right;font-weight:700">'+
        (dd?Math.ceil(p.remaining/dd):"—")+'</span></div>';
  });
  if(!any)html+='<div class="empty">設定タブで教材の1周目問題数を入れるとノルマが出ます。</div>';
  html+='<div class="row" style="border-top:1px solid var(--line);margin-top:6px"><span class="nm" style="color:var(--sub)">合計</span>'+
    '<span class="pill num">'+totalRemaining()+'問</span>'+
    '<span class="num" style="font-size:15px;font-weight:800;min-width:38px;text-align:right">'+(dailyQuota()==null?"—":dailyQuota())+'</span></div>';
  html+='<div class="hint">母数は暦日ではなく、ノルマ対象の種別が割り当たった日数です。</div></div>';

  if(S.results&&S.results.length){
    html+='<div class="card"><h2>模試・本試験</h2>';
    S.results.slice().sort(function(a,b){return a.date<b.date?1:-1}).forEach(function(r){
      var ks=Object.keys(r.scores||{});
      html+='<div style="padding:10px 0;border-bottom:1px solid var(--line2)">'+
        '<div style="display:flex;gap:7px;align-items:baseline"><b style="font-size:14px">'+esc(r.exam)+'</b>'+
        '<span class="pill">'+esc(r.mode)+'式</span><span class="sm num" style="margin-left:auto">'+esc(r.date)+'</span></div>'+
        '<div class="sm num" style="margin-top:5px">'+ks.map(function(k){
          var v=r.scores[k];
          return esc(k)+' <b style="color:'+(v<=1?"var(--bad)":"var(--ink)")+'">'+v+'</b>'}).join("　")+'</div></div>';
    });
    html+='<div class="hint">科目別の弱点は、来週の科目を選ぶときの材料に。</div></div>';
  }
  return html;
}

/* ---------- sheets ---------- */
var sheet=null;
function showSheet(kind){
  if(kind==="rec"){ go("rec"); return; }
  sheet=kind;
  var h='', isCur=kind==="pickcur";
  var cand=prioritySubjects();
  h='<h3>'+(isCur?"今週":"来週")+'の科目</h3>'+
    '<div class="hint" style="margin:0 0 12px">最終周回日が古い順です。提案どおりでなくて構いません。</div>';
  cand.forEach(function(c,i){
    var sel=(isCur?S.week.current:S.week.next)===c.id;
    h+='<button class="choice'+(sel?" on":"")+'" data-pick="'+esc(c.id)+'" data-cur="'+(isCur?1:0)+'">'+
      '<span class="s">'+(c.last==null?"未着手":c.ago+"日前")+'</span>'+esc(c.name)+
      (i<3?' <span class="pill b" style="margin-left:6px">候補</span>':'')+'</button>';
  });
  h+='<button class="ghost" style="width:100%;margin-top:10px" data-close="1">閉じる</button>';
  document.body.insertAdjacentHTML("beforeend",
    '<div class="sheetbg" id="sheetbg"><div class="sheet">'+h+'</div></div>');
}
function closeSheet(){sheet=null;var e=document.getElementById("sheetbg");if(e)e.remove()}

/* ---------- guards ---------- */
function typeUsed(id){return S.records.some(function(r){return r.typeId===id})}
function subjUsed(id){return S.records.some(function(r){return r.subjectId===id})}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-go],[data-sheet],[data-close],[data-pick],[data-kind],[data-addblk],[data-delblk],"+
    "[data-toggledone],[data-submit],[data-openy],[data-openm],[data-opend],[data-del],[data-addtm],[data-deltm],"+
    "[data-addty],[data-delty],[data-tyq],[data-tyh],[data-addsub],[data-delsub],[data-subh],"+
    "[data-addmat],[data-delmat],[data-matq],[data-math],[data-addms],[data-delms],"+
    "[data-export],[data-import],[data-gran],[data-axis],[data-theme],[data-gradtoggle],"+
    "[data-pal],[data-setcolor],[data-addtt],[data-deltt]");
  if(!el)return;
  var d=el.dataset;
  if(d.go){go(d.go);return}
  if(d.sheet){showSheet(d.sheet);return}
  if(d.close!==undefined){closeSheet();return}
  if(d.pick){ if(d.cur==="1")S.week.current=d.pick; else S.week.next=d.pick;
    save();closeSheet();render();return}

  if(d.gran){statGran=d.gran;render();return}
  if(d.axis){statAxis=d.axis;render();return}
  if(d.theme){S.config.theme=d.theme;save();render();return}
  if(d.gradtoggle){S.config.gradient=!S.config.gradient;save();render();return}
  if(d.pal){palOpen=(palOpen&&palOpen.kind===d.pal&&palOpen.id===d.pid)?null:{kind:d.pal,id:d.pid};render();return}
  if(d.setcolor){
    var arr=d.pk==="type"?S.types:S.subjects;
    var row=arr.filter(function(x){return x.id===d.pid})[0];
    if(row)row.color=d.setcolor;
    palOpen=null;save();render();return}

  if(d.kind){planKind=d.kind;render();return}
  if(d.addtt){var nt={id:"tt"+uid(),name:"新しいテンプレ",blocks:[]};S.timeTemplates.push(nt);planKind=nt.id;save();render();return}
  if(d.deltt){
    if(S.timeTemplates.length<=1){alert("最後のテンプレートは削除できません。");return}
    var used=Object.keys(S.weekTemplate).filter(function(k){return S.weekTemplate[k]===d.deltt});
    if(used.length&&!confirm(used.length+"つの曜日に割り当てられています。削除すると未割り当てになります。よろしいですか。"))return;
    S.timeTemplates=S.timeTemplates.filter(function(x){return x.id!==d.deltt});
    used.forEach(function(k){delete S.weekTemplate[k]});
    planKind=(S.timeTemplates[0]||{}).id||null;save();render();return}
  if(d.addblk){var tt0=ttById(planKind);if(tt0){tt0.blocks=tt0.blocks||[];tt0.blocks.push({id:uid(),start:"",end:""})}save();render();return}
  if(d.delblk){var tt1=ttById(planKind);if(tt1)tt1.blocks.splice(+d.delblk,1);save();render();return}

  if(d.addtm){F.times.push("");render();return}
  if(d.deltm){F.times.splice(+d.deltm,1);if(!F.times.length)F.times=[""];render();return}
  if(d.toggledone){F.done=!F.done;render();return}
  if(d.submit){submit();return}

  if(d.openy!==undefined&&d.openy){recOpenY=recOpenY===d.openy?null:d.openy;render();return}
  if(d.openm!==undefined&&d.openm){recOpenM=recOpenM===d.openm?null:d.openm;render();return}
  if(d.opend!==undefined&&d.opend){recOpenD=recOpenD===d.opend?null:d.opend;render();return}
  if(d.del){S.records=S.records.filter(function(r){return r.id!==d.del});save();render();return}

  if(d.addty){S.types.push({id:"t"+uid(),name:"新しい教材",color:PALETTE[S.types.length%PALETTE.length],quota:true,hidden:false});save();render();return}
  if(d.delty){
    if(typeUsed(d.delty)){alert("この種別には記録があります。削除できません。「非表示」にしてください。");return}
    if(S.materials.some(function(m){return m.typeId===d.delty})&&
       !confirm("この種別の教材も一緒に削除されます。よろしいですか。"))return;
    S.materials=S.materials.filter(function(m){return m.typeId!==d.delty});
    S.types=S.types.filter(function(x){return x.id!==d.delty});
    Object.keys(S.weekPlan).forEach(function(k){if(S.weekPlan[k]===d.delty)delete S.weekPlan[k]});
    save();render();return}
  if(d.tyq){var ty=typ(d.tyq);if(ty)ty.quota=!ty.quota;save();render();return}
  if(d.tyh){var ty2=typ(d.tyh);if(ty2)ty2.hidden=!ty2.hidden;save();render();return}

  if(d.addsub){S.subjects.push({id:"s"+uid(),code:pad(S.subjects.length+1),name:"新科目",
    color:PALETTE[S.subjects.length%PALETTE.length],hidden:false});save();render();return}
  if(d.delsub){
    if(subjUsed(d.delsub)){alert("この科目には記録があります。削除できません。「非表示」にしてください。");return}
    S.materials=S.materials.filter(function(m){return m.subjectId!==d.delsub});
    S.subjects=S.subjects.filter(function(x){return x.id!==d.delsub});
    save();render();return}
  if(d.subh){var sb=subj(d.subh);if(sb)sb.hidden=!sb.hidden;save();render();return}

  if(d.matq){var mq=S.materials[+d.matq];mq.quota=!isQuota(mq);save();render();return}
  if(d.math){var mh=S.materials[+d.math];mh.hidden=!mh.hidden;save();render();return}
  if(d.addmat){var s0=S.subjects[0],t0=S.types[0];if(!s0||!t0)return;
    S.materials.push({id:"m"+uid(),subjectId:s0.id,typeId:t0.id,targetLaps:1,lap1Problems:"",hidden:false});
    save();render();return}
  if(d.delmat){
    var mm0=S.materials[+d.delmat];
    if(mm0&&S.records.some(function(r){return r.subjectId===mm0.subjectId&&r.typeId===mm0.typeId})){
      alert("この教材には記録があります。削除できません。「非表示」にしてください。");return}
    S.materials.splice(+d.delmat,1);save();render();return}

  if(d.addms){S.milestones.push({id:uid(),name:"第"+(S.milestones.length+1)+"MS",date:todayISO(),plan:"",review:"",nextFocus:""});save();render();return}
  if(d.delms){S.milestones=S.milestones.filter(function(m){return m.id!==d.delms});save();render();return}
  if(d.export){doExport();return}
  if(d.import){document.getElementById("fileIn").click();return}
});
document.addEventListener("change",function(ev){
  var el=ev.target,d=el.dataset;
  if(el.id==="fileIn"&&el.files[0]){doImport(el.files[0]);return}
  if(d.wp!==undefined){ if(el.value)S.weekPlan[d.wp]=el.value; else delete S.weekPlan[d.wp];
    save();render();return}
  if(d.wt!==undefined){ if(el.value)S.weekTemplate[d.wt]=el.value; else delete S.weekTemplate[d.wt];
    save();render();return}
  if(d.f&&d.blk!==undefined){var tt=ttById(planKind);
    if(tt)tt.blocks[+d.blk][d.f]=el.value.replace(/[^0-9]/g,"");save();render();return}
  if(d.mat!==undefined&&(d.f==="subjectId"||d.f==="typeId")){
    var mv=S.materials[+d.mat]; mv[d.f]=el.value; save();render();return}
  if(d.tm!==undefined){F.times[+d.tm]=el.value.replace(/[^0-9]/g,"");render();return}
  if(d.f&&["date","subjectId","typeId","problems","memo"].indexOf(d.f)>=0&&!d.mat&&!d.sub&&!d.ty&&!d.msx){
    F[d.f]=el.value; if(d.f!=="problems"&&d.f!=="memo"){F.loaded="";render()} return}
});
document.addEventListener("input",function(ev){
  var el=ev.target,d=el.dataset;
  if(d.week){S.week[d.week]=el.value;save();return}
  if(d.ttn!==undefined){var t0=ttById(d.ttn);if(t0)t0.name=el.value;save();return}
  if(d.ms){var m=S.milestones.filter(function(x){return x.id===d.ms})[0];if(m){m[d.f]=el.value;save()}return}
  if(d.msx){var m2=S.milestones.filter(function(x){return x.id===d.msx})[0];if(m2){m2[d.f]=el.value;save()}return}
  if(d.cfg){var v=el.value;
    if(["spareDays","targetHours","cyclePeriod"].indexOf(d.cfg)>=0)v=+String(v).replace(/[^0-9]/g,"")||0;
    S.config[d.cfg]=v;save();return}
  if(d.ty!==undefined&&d.f){var t2=typ(d.ty);if(t2)t2[d.f]=el.value;save();return}
  if(d.sub!==undefined&&d.f){var s2=subj(d.sub);if(s2)s2[d.f]=el.value;save();return}
  if(d.mat!==undefined&&d.f){var mm=S.materials[+d.mat];
    mm[d.f]=(d.f==="targetLaps")?(+el.value.replace(/[^0-9]/g,"")||0):el.value.replace(/[^0-9]/g,"");save();return}
  if(d.tm!==undefined){F.times[+d.tm]=el.value.replace(/[^0-9]/g,"");return}
  if(d.f&&["problems","memo"].indexOf(d.f)>=0&&d.blk===undefined){F[d.f]=el.value;return}
});

function submit(){
  if(!F.date)F.date=todayISO();
  if(!F.subjectId||!F.typeId){alert("科目と教材を選んでください。");return}
  var p=+String(F.problems).replace(/[^0-9]/g,"")||0;
  var mi=(F.times||[]).reduce(function(a,s){return a+parseHHMM(s)},0);
  if(!p&&!mi&&!F.done){alert("問題数か時間を入れてください。");return}
  var ex=S.records.filter(function(r){return r.date===F.date&&r.subjectId===F.subjectId&&r.typeId===F.typeId})[0];
  if(ex){ ex.problems=p; ex.minutes=mi; ex.done=!!F.done; ex.memo=(F.memo||"").trim(); }
  else{
    var lap=lapSegments(S.records,F.subjectId,F.typeId).length;
    var op=openSeg(F.subjectId,F.typeId);
    S.records.unshift({id:uid(),date:F.date,subjectId:F.subjectId,typeId:F.typeId,
      lap:op?lap:lap+1,problems:p,wrong:0,minutes:mi,done:!!F.done,memo:(F.memo||"").trim(),lapTotal:null});
  }
  F.loaded=""; save(); render();
}
function doExport(){
  var blob=new Blob([JSON.stringify(Object.assign({app:"sharoushi-study-manager",version:VER},S),null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="ssm-backup-"+todayISO()+".json";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
function doImport(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{ S=adopt(JSON.parse(rd.result)); fill(); save(); applyTheme(); render(); alert("読み込みました。"); }
    catch(e){ alert("読み込めませんでした。JSONを確認してください。"); }
  };
  rd.readAsText(file);
}

load();render();
</script>
